<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado AWS Certified Cloud Practitioner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f2f3f3; /* AWS Light Gray */
            color: #16191f; /* AWS Dark text */
        }
        .aws-bg-dark { background-color: #232f3e; }
        .aws-text-dark { color: #232f3e; }
        .aws-bg-orange { background-color: #ff9900; }
        .aws-text-orange { color: #ff9900; }
        .aws-border-orange { border-color: #ff9900; }
        
        .aws-btn { transition: all 0.2s ease-in-out; }
        .aws-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .option-card.selected {
            border-color: #ff9900;
            background-color: #fffaf0;
        }
        .option-card.correct {
            border-color: #10b981;
            background-color: #ecfdf5;
        }
        .option-card.wrong {
            border-color: #ef4444;
            background-color: #fef2f2;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="aws-bg-dark text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6 aws-text-orange" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                AWS Cloud Practitioner Simulado
            </h1>
            <button id="btn-home" class="hidden text-sm hover:text-orange-400 font-medium px-3 py-1 rounded bg-gray-800 transition">
                Voltar ao Início
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 w-full max-w-6xl mx-auto">
        
        <!-- START SCREEN -->
        <div id="screen-start" class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in">
            
            <!-- Setup Card -->
            <div class="md:col-span-2 bg-white rounded-xl shadow-lg p-6 sm:p-8 border border-gray-200">
                <h2 class="text-2xl font-bold aws-text-dark mb-6">Novo Simulado</h2>
                
                <form id="setup-form" class="space-y-6">
                    <!-- Nível -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Nível de Dificuldade</label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="level" value="facil" class="peer sr-only" checked>
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">Fácil</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="level" value="intermediario" class="peer sr-only">
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">Intermediário</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="level" value="dificil" class="peer sr-only">
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">Difícil</div>
                            </label>
                        </div>
                    </div>

                    <!-- Quantidade -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Quantidade de Questões</label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="count" value="25" class="peer sr-only" checked>
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">25</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="count" value="45" class="peer sr-only">
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">45</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="count" value="65" class="peer sr-only">
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">65</div>
                            </label>
                        </div>
                    </div>

                    <!-- Modo -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Modo de Execução</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="mode" value="teste" class="peer sr-only" checked>
                                <div class="p-4 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">
                                    <div class="font-bold text-gray-800">Modo Teste</div>
                                    <div class="text-xs text-gray-500 mt-1">Feedback de acerto/erro após confirmar cada resposta.</div>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="mode" value="exame" class="peer sr-only">
                                <div class="p-4 rounded-lg border-2 border-gray-200 peer-checked:aws-border-orange peer-checked:bg-orange-50 hover:bg-gray-50 transition">
                                    <div class="font-bold text-gray-800">Modo Exame</div>
                                    <div class="text-xs text-gray-500 mt-1">Sem interrupções. Resultado e feedback apenas no final.</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full aws-bg-orange text-white font-bold text-lg py-4 rounded-lg shadow aws-btn">
                        Iniciar Simulado
                    </button>
                </form>
            </div>

            <!-- History Sidebar -->
            <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8 border border-gray-200 flex flex-col max-h-[600px]">
                <h2 class="text-xl font-bold aws-text-dark mb-4 border-b pb-2">Seu Histórico</h2>
                <div id="history-container" class="flex-grow overflow-y-auto space-y-3 pr-2">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="screen-quiz" class="hidden w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 sm:p-8 border border-gray-200">
            <!-- Progress Header -->
            <div class="flex justify-between items-center mb-4 text-sm font-medium text-gray-500">
                <span id="quiz-progress-text">Questão 1 de 25</span>
                <span id="quiz-mode-badge" class="bg-blue-100 text-blue-800 py-1 px-3 rounded-full text-xs font-bold">Modo Teste</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="quiz-progress-bar" class="aws-bg-orange h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Question Area -->
            <div class="mb-8">
                <h3 id="question-text" class="text-xl sm:text-2xl font-semibold text-gray-800 leading-snug mb-2"></h3>
                <p id="question-instruction" class="text-sm text-gray-500 italic mb-4 font-medium"></p>
                
                <div id="options-container" class="space-y-3 mt-6">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Feedback Area (Test Mode) -->
            <div id="feedback-container" class="hidden mb-6 p-5 rounded-lg border shadow-sm">
                <div id="feedback-title" class="font-bold text-lg mb-2"></div>
                <div id="feedback-text" class="text-gray-700 text-sm leading-relaxed"></div>
            </div>

            <!-- Controls -->
            <div class="flex justify-between items-center pt-6 border-t border-gray-200">
                <button id="btn-prev" class="px-5 py-2 rounded-lg font-medium text-gray-600 border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition">
                    Anterior
                </button>
                
                <div class="flex gap-3">
                    <button id="btn-confirm" class="hidden px-6 py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 transition shadow disabled:opacity-50 disabled:cursor-not-allowed">
                        Confirmar Resposta
                    </button>
                    <button id="btn-next" class="px-6 py-2 rounded-lg font-medium text-white aws-bg-dark hover:bg-gray-800 transition shadow">
                        Próxima Questão
                    </button>
                    <button id="btn-finish" class="hidden px-6 py-2 rounded-lg font-bold text-white aws-bg-orange hover:bg-orange-600 transition shadow">
                        Finalizar Simulado
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="screen-results" class="hidden w-full max-w-5xl bg-white rounded-xl shadow-lg p-6 sm:p-8 border border-gray-200">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold aws-text-dark mb-2">Resultado Final</h2>
                <div class="inline-block mt-4">
                    <div class="relative w-32 h-32 flex items-center justify-center rounded-full border-8 border-gray-100 mx-auto">
                        <svg id="score-ring" class="absolute top-0 left-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="46" fill="transparent"></circle>
                            <circle id="score-circle-progress" class="aws-text-orange stroke-current transition-all duration-1000 ease-out" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="46" fill="transparent" stroke-dasharray="289" stroke-dashoffset="289"></circle>
                        </svg>
                        <div class="absolute flex flex-col items-center">
                            <span id="score-percent" class="text-3xl font-bold text-gray-800">0%</span>
                        </div>
                    </div>
                </div>
                <p id="score-text" class="mt-4 text-lg font-medium text-gray-600"></p>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Revisão de Questões Incorretas
                </h3>
                
                <div id="review-container" class="space-y-6 mt-4">
                    <!-- Incorrect questions injected here -->
                </div>
            </div>

            <div class="mt-8 pt-6 border-t flex justify-center">
                <button onclick="goHome()" class="px-8 py-3 rounded-lg font-bold text-white aws-bg-dark hover:bg-gray-800 transition shadow-lg">
                    Novo Simulado
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- BANCO DE QUESTÕES ---
        const allQuestions = [
            {
                id: 1, level: "intermediario",
                text: "Em cenários de migração para a AWS, como as empresas podem aplicar o AWS Application Discovery Service para auxiliá-las?",
                options: [
                    "Para automatizar a migração de instâncias EC2 diretamente do on-premises.",
                    "Para identificar e avaliar as dependências de aplicativos e servidores locais.",
                    "Para monitorar o custo financeiro da migração em tempo real.",
                    "Para configurar a rede híbrida (VPN) automaticamente."
                ],
                correctAnswers: [1],
                explanation: "O AWS Application Discovery Service ajuda a coletar dados de utilização e dependência de ambientes on-premises para planejar a migração com precisão."
            },
            {
                id: 2, level: "intermediario",
                text: "Qual serviço da AWS simplifica o processo de conformidade ao garantir que apenas softwares licenciados estejam presentes na rede?",
                options: [
                    "AWS Config",
                    "AWS Inspector",
                    "License Manager",
                    "AWS Artifact"
                ],
                correctAnswers: [2],
                explanation: "O License Manager facilita o gerenciamento, rastreamento e validação de licenças de software em conformidade com as regras dos fabricantes."
            },
            {
                id: 3, level: "intermediario",
                text: "Qual é o banco de dados sem servidor (serverless) da AWS que oferece escalabilidade automática, suporte a esquemas flexíveis e é ideal para cargas de trabalho de baixa latência?",
                options: [
                    "Amazon RDS",
                    "Amazon Aurora",
                    "Amazon Redshift",
                    "DynamoDB"
                ],
                correctAnswers: [3],
                explanation: "O DynamoDB é um banco de dados NoSQL chave-valor totalmente gerenciado que escala infinitamente com alta performance, sendo serverless."
            },
            {
                id: 4, level: "dificil",
                text: "Quais opções representam recursos fundamentais do AWS Cloud Adoption Framework (AWS CAF) para a perspectiva de segurança? (Selecione 3)",
                options: [
                    "Monitoramento de atividades e auditoria de logs de segurança.",
                    "Redução de custos operacionais com instâncias Spot.",
                    "Implementação de controles de acesso baseados em identidade.",
                    "Provisionamento de rede física global.",
                    "Proteção de dados com criptografia em repouso e em trânsito."
                ],
                correctAnswers: [0, 2, 4],
                explanation: "A perspectiva de segurança do CAF foca em garantir a integridade, confidencialidade e disponibilidade dos dados e sistemas através de IAM, criptografia e auditoria."
            },
            {
                id: 5, level: "intermediario",
                text: "Qual serviço da AWS é recomendado para realizar uma grande quantidade de processos em lote (batch) com escalabilidade automática, sem provisionamento antecipado?",
                options: [
                    "AWS Lambda",
                    "AWS Batch",
                    "Amazon EC2 Auto Scaling",
                    "AWS Step Functions"
                ],
                correctAnswers: [1],
                explanation: "O AWS Batch gerencia de forma dinâmica os recursos computacionais necessários para rodar milhares de tarefas em lote de maneira eficiente."
            },
            {
                id: 10, level: "facil",
                text: "Quais são as principais características e funcionalidades do AWS Identity and Access Management (IAM)? (Selecione 3)",
                options: [
                    "Suporta integração com provedores externos para autenticação federada.",
                    "Configura roteamento de rede entre VPCs.",
                    "Oferece autenticação multifator (MFA).",
                    "Realiza backup automático de instâncias EC2.",
                    "Permite a criação de políticas detalhadas de controle de acesso."
                ],
                correctAnswers: [0, 2, 4],
                explanation: "O IAM é o serviço central para gerenciar identidades, permitindo federação, MFA e políticas de permissões granulares."
            },
            {
                id: 12, level: "intermediario",
                text: "Qual serviço de rede de entrega de conteúdo (CDN) reduz a latência global na distribuição de vídeos, imagens e arquivos estáticos/dinâmicos?",
                options: [
                    "AWS Global Accelerator",
                    "Amazon Route 53",
                    "AWS Direct Connect",
                    "Amazon CloudFront"
                ],
                correctAnswers: [3],
                explanation: "O CloudFront utiliza uma rede global de pontos de presença (Edge Locations) para fazer cache de conteúdo próximo aos usuários finais."
            },
            {
                id: 17, level: "facil",
                text: "Quais são os 6 pilares do Well-Architected Framework da AWS?",
                options: [
                    "Excelência Operacional, Segurança, Confiabilidade, Desempenho Eficiente, Escalabilidade, Disciplina.",
                    "Excelência Operacional, Segurança, Confiabilidade, Desempenho Eficiente, Otimização de Custos, Sustentabilidade.",
                    "Desenvolvimento, Operações, Segurança, Confiabilidade, Elasticidade, Sustentabilidade."
                ],
                correctAnswers: [1],
                explanation: "Os 6 pilares são: Excelência operacional, Segurança, Confiabilidade, Eficiência de performance, Otimização de custos e Sustentabilidade."
            }
        ];

        // --- ESTADO DA APLICAÇÃO ---
        let state = {
            history: [],
            currentSession: null
        };

        // --- STREAMING_CHUNK:Lógica de Inicialização ---
        function initApp() {
            const savedState = localStorage.getItem('awsSimulatorState');
            if (savedState) {
                try { state = JSON.parse(savedState); } 
                catch (e) { console.error("Erro ao carregar histórico", e); }
            }

            document.getElementById('setup-form').addEventListener('submit', startNewQuiz);
            document.getElementById('btn-home').addEventListener('click', goHome);
            document.getElementById('btn-next').addEventListener('click', handleNext);
            document.getElementById('btn-prev').addEventListener('click', handlePrev);
            document.getElementById('btn-finish').addEventListener('click', finishQuiz);
            document.getElementById('btn-confirm').addEventListener('click', handleConfirm);

            renderStartScreen();
        }

        function saveState() {
            localStorage.setItem('awsSimulatorState', JSON.stringify(state));
        }

        // --- STREAMING_CHUNK:Lógica da Tela Inicial ---
        function renderStartScreen() {
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-results').classList.add('hidden');
            document.getElementById('btn-home').classList.add('hidden');

            const historyContainer = document.getElementById('history-container');
            historyContainer.innerHTML = '';

            if (state.history.length === 0) {
                historyContainer.innerHTML = '<p class="text-sm text-gray-500 text-center mt-10">Nenhum simulado no histórico.</p>';
            } else {
                [...state.history].reverse().forEach((session, index) => {
                    const actualIndex = state.history.length - 1 - index;
                    const date = new Date(session.date).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                    
                    const isCompleted = session.status === 'completed';
                    const scoreText = isCompleted ? `Nota: ${(session.score * 100).toFixed(0)}%` : 'Em andamento';
                    
                    const el = document.createElement('div');
                    el.className = `p-4 rounded-lg border flex justify-between items-center ${isCompleted ? 'bg-gray-50' : 'bg-blue-50 border-blue-200'}`;
                    el.innerHTML = `
                        <div>
                            <div class="font-bold text-sm text-gray-800">Simulado ${session.level.toUpperCase()}</div>
                            <div class="text-xs text-gray-500 mt-1">${date} • ${session.mode === 'teste' ? 'Modo Teste' : 'Modo Exame'}</div>
                            <div class="text-sm font-semibold mt-1 ${isCompleted ? (session.score >= 0.7 ? 'text-green-600' : 'text-red-500') : 'text-blue-600'}">${scoreText}</div>
                        </div>
                        <button onclick="${isCompleted ? `viewResults(${actualIndex})` : `continueQuiz(${actualIndex})`}" 
                                class="px-3 py-1.5 rounded text-sm font-medium ${isCompleted ? 'bg-gray-200 text-gray-700 hover:bg-gray-300' : 'aws-bg-orange text-white hover:bg-orange-600'} transition">
                            ${isCompleted ? 'Revisar' : 'Continuar'}
                        </button>
                    `;
                    historyContainer.appendChild(el);
                });
            }
        }

        // --- STREAMING_CHUNK:Lógica de Criação do Quiz ---
        function startNewQuiz(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const level = formData.get('level');
            const count = parseInt(formData.get('count'));
            const mode = formData.get('mode');

            let pool = allQuestions; 
            let selectedQuestions = [];
            let iterations = 0;
            
            // Simula banco maior duplicando/embaralhando caso count > disponíveis
            while(selectedQuestions.length < count && iterations < 5) {
                let shuffled = [...pool].sort(() => 0.5 - Math.random());
                for(let q of shuffled) {
                    if (selectedQuestions.length < count) {
                        selectedQuestions.push(JSON.parse(JSON.stringify(q)));
                    }
                }
                iterations++;
            }

            state.currentSession = {
                id: Date.now(),
                date: new Date().toISOString(),
                level: level,
                mode: mode,
                total: selectedQuestions.length,
                questions: selectedQuestions,
                currentIndex: 0,
                userAnswers: {}, 
                confirmedAnswers: {}, // NOVA PROPRIEDADE: Controla se a questão já foi avaliada
                status: 'in-progress'
            };

            state.history.push(state.currentSession);
            saveState();
            loadQuizScreen();
        }

        function continueQuiz(historyIndex) {
            state.currentSession = state.history[historyIndex];
            // Garante compatibilidade caso o histórico não tenha a propriedade
            if(!state.currentSession.confirmedAnswers) state.currentSession.confirmedAnswers = {};
            loadQuizScreen();
        }

        function goHome() {
            state.currentSession = null;
            renderStartScreen();
        }

        // --- STREAMING_CHUNK:Lógica de Renderização do Quiz ---
        function loadQuizScreen() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-results').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('btn-home').classList.remove('hidden');

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const session = state.currentSession;
            const q = session.questions[session.currentIndex];
            const isMulti = q.correctAnswers.length > 1;
            const qKey = `${session.currentIndex}`;

            document.getElementById('quiz-progress-text').innerText = `Questão ${session.currentIndex + 1} de ${session.total}`;
            document.getElementById('quiz-progress-bar').style.width = `${((session.currentIndex + 1) / session.total) * 100}%`;
            document.getElementById('quiz-mode-badge').innerText = session.mode === 'teste' ? 'Modo Teste' : 'Modo Exame';
            
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('question-instruction').innerText = isMulti ? `(Selecione exatamente ${q.correctAnswers.length} opções corretas)` : "(Selecione 1 opção correta)";

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const selectedSet = new Set(session.userAnswers[qKey] || []);
            const isAnswered = selectedSet.size > 0;
            
            // NOVA LÓGICA: Só mostra feedback no Modo Teste SE a resposta já foi confirmada
            const isConfirmed = session.mode === 'exame' ? false : !!session.confirmedAnswers[qKey];
            const showTestFeedback = session.mode === 'teste' && isConfirmed;

            q.options.forEach((opt, index) => {
                const el = document.createElement('div');
                const isSelected = selectedSet.has(index);
                const isCorrect = q.correctAnswers.includes(index);
                
                let extraClasses = 'border-gray-200 hover:border-gray-300 hover:bg-gray-50';
                
                if (isSelected) extraClasses = 'selected';
                
                if (showTestFeedback) {
                    if (isCorrect) extraClasses = 'correct';
                    else if (isSelected && !isCorrect) extraClasses = 'wrong';
                    else extraClasses = 'border-gray-200 opacity-50'; // escurece as não selecionadas e não corretas
                }

                // Se já confirmou, desabilita cliques
                const pointerEvent = isConfirmed ? 'pointer-events-none opacity-90' : 'cursor-pointer';
                
                el.className = `option-card border-2 rounded-lg p-4 transition flex gap-3 items-start ${extraClasses} ${pointerEvent}`;
                
                if (!isConfirmed) {
                    el.onclick = () => handleOptionSelect(index, isMulti, q.correctAnswers.length);
                }

                const inputType = isMulti ? 'checkbox' : 'radio';
                const inputChecked = isSelected ? 'checked' : '';
                
                el.innerHTML = `
                    <div class="mt-0.5">
                        <input type="${inputType}" class="w-5 h-5 text-orange-500 rounded border-gray-300 pointer-events-none" ${inputChecked}>
                    </div>
                    <div class="text-gray-700 font-medium">${opt}</div>
                `;
                container.appendChild(el);
            });

            // Lógica do Quadro de Feedback
            const fbContainer = document.getElementById('feedback-container');
            if (showTestFeedback) {
                fbContainer.classList.remove('hidden');
                
                const isFullyCorrect = selectedSet.size === q.correctAnswers.length && 
                                      [...selectedSet].every(val => q.correctAnswers.includes(val));
                
                if (isFullyCorrect) {
                    fbContainer.className = 'mb-6 p-5 rounded-lg border border-green-200 bg-green-50';
                    document.getElementById('feedback-title').innerHTML = '✅ Correto!';
                    document.getElementById('feedback-title').className = 'font-bold text-lg mb-2 text-green-700';
                } else {
                    fbContainer.className = 'mb-6 p-5 rounded-lg border border-red-200 bg-red-50';
                    document.getElementById('feedback-title').innerHTML = '❌ Incorreto';
                    document.getElementById('feedback-title').className = 'font-bold text-lg mb-2 text-red-700';
                }
                
                // Formata quais eram as respostas corretas
                const correctTexts = q.correctAnswers.map(idx => `• ${q.options[idx]}`).join('<br>');
                
                document.getElementById('feedback-text').innerHTML = `
                    <div class="mb-3 text-gray-800">
                        <strong class="block mb-1">A(s) resposta(s) correta(s):</strong>
                        ${correctTexts}
                    </div>
                    <div class="pt-3 border-t border-gray-200/60">
                        <strong class="block mb-1 text-gray-800">Explicação:</strong>
                        ${q.explanation}
                    </div>
                `;
            } else {
                fbContainer.classList.add('hidden');
            }

            updateControls(isAnswered, isConfirmed, isMulti, selectedSet.size, q.correctAnswers.length);
        }

        // --- STREAMING_CHUNK:Lógica de Interação e Controles ---
        function updateControls(isAnswered, isConfirmed, isMulti, selectedCount, requiredCount) {
            const session = state.currentSession;
            
            document.getElementById('btn-prev').disabled = session.currentIndex === 0;
            
            const btnNext = document.getElementById('btn-next');
            const btnFinish = document.getElementById('btn-finish');
            const btnConfirm = document.getElementById('btn-confirm');
            
            const isLast = session.currentIndex === session.total - 1;

            if (session.mode === 'teste') {
                if (isConfirmed) {
                    // Já validou a resposta, esconde confirmar, mostra próximo
                    btnConfirm.classList.add('hidden');
                    
                    if (isLast) {
                        btnNext.classList.add('hidden');
                        btnFinish.classList.remove('hidden');
                    } else {
                        btnNext.classList.remove('hidden');
                        btnFinish.classList.add('hidden');
                    }
                } else {
                    // Ainda não validou a resposta
                    btnConfirm.classList.remove('hidden');
                    btnNext.classList.add('hidden');
                    btnFinish.classList.add('hidden');
                    
                    // Só habilita o confirmar se selecionou exatamente o número exigido de opções
                    const hasRequiredAnswers = isMulti ? selectedCount === requiredCount : isAnswered;
                    btnConfirm.disabled = !hasRequiredAnswers;
                }
            } else {
                // Modo Exame (sem botão confirmar intermediário)
                btnConfirm.classList.add('hidden');
                
                if (isLast) {
                    btnNext.classList.add('hidden');
                    btnFinish.classList.remove('hidden');
                } else {
                    btnNext.classList.remove('hidden');
                    btnFinish.classList.add('hidden');
                }
            }
        }

        function handleOptionSelect(optIndex, isMulti, maxAllowed) {
            const session = state.currentSession;
            const qKey = `${session.currentIndex}`;
            let currentSelections = session.userAnswers[qKey] || [];
            
            if (isMulti) {
                if (currentSelections.includes(optIndex)) {
                    // Desmarcar
                    currentSelections = currentSelections.filter(i => i !== optIndex);
                } else {
                    // Marcar (só permite marcar até o limite estabelecido na questão)
                    if (currentSelections.length < maxAllowed) {
                        currentSelections.push(optIndex);
                    }
                }
            } else {
                // Radio button substitui a seleção
                currentSelections = [optIndex];
            }
            
            session.userAnswers[qKey] = currentSelections;
            saveState();
            renderCurrentQuestion();
        }

        function handleConfirm() {
            const session = state.currentSession;
            const qKey = `${session.currentIndex}`;
            session.confirmedAnswers[qKey] = true;
            saveState();
            renderCurrentQuestion();
        }

        function handleNext() {
            if (state.currentSession.currentIndex < state.currentSession.total - 1) {
                state.currentSession.currentIndex++;
                saveState();
                renderCurrentQuestion();
            }
        }

        function handlePrev() {
            if (state.currentSession.currentIndex > 0) {
                state.currentSession.currentIndex--;
                saveState();
                renderCurrentQuestion();
            }
        }

        // --- STREAMING_CHUNK:Lógica de Finalização e Resultados ---
        function finishQuiz() {
            const session = state.currentSession;
            let score = 0;
            let incorrectQs = [];

            session.questions.forEach((q, index) => {
                const ans = session.userAnswers[`${index}`] || [];
                // Para estar correta, tem que ter marcado a mesma quantidade e as mesmas alternativas
                const isCorrect = ans.length === q.correctAnswers.length && ans.every(v => q.correctAnswers.includes(v));
                if (isCorrect) {
                    score++;
                } else {
                    incorrectQs.push({ q: q, userAns: ans, index: index + 1 });
                }
            });

            session.status = 'completed';
            session.score = score / session.total;
            session.incorrectLog = incorrectQs;
            saveState();

            const historyIndex = state.history.findIndex(s => s.id === session.id);
            viewResults(historyIndex);
        }

        function viewResults(historyIndex) {
            const session = state.history[historyIndex];
            
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-results').classList.remove('hidden');
            document.getElementById('btn-home').classList.remove('hidden');

            const percent = Math.round(session.score * 100);
            document.getElementById('score-percent').innerText = `${percent}%`;
            
            const circle = document.getElementById('score-circle-progress');
            const circumference = 2 * Math.PI * 46; 
            const offset = circumference - (percent / 100) * circumference;
            setTimeout(() => { circle.style.strokeDashoffset = offset; }, 100);
            
            const isPass = percent >= 70;
            circle.classList.remove('aws-text-orange', 'text-green-500', 'text-red-500');
            circle.classList.add(isPass ? 'text-green-500' : 'text-red-500');
            
            const scoreText = document.getElementById('score-text');
            if (isPass) {
                scoreText.innerHTML = `🎉 Parabéns! Você foi <strong>Aprovado</strong>.`;
                scoreText.className = "mt-4 text-lg font-medium text-green-600";
            } else {
                scoreText.innerHTML = `⚠️ Não foi dessa vez. Pontuação mínima exigida: 70%.`;
                scoreText.className = "mt-4 text-lg font-medium text-red-600";
            }

            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            if (session.incorrectLog && session.incorrectLog.length > 0) {
                session.incorrectLog.forEach(log => {
                    const q = log.q;
                    const el = document.createElement('div');
                    el.className = "bg-gray-50 border border-gray-200 rounded-lg p-5";
                    
                    let optionsHTML = '';
                    q.options.forEach((opt, i) => {
                        const isUserSel = log.userAns.includes(i);
                        const isCorrect = q.correctAnswers.includes(i);
                        
                        let badge = '';
                        let textClass = 'text-gray-600';
                        if (isCorrect) {
                            badge = '<span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded ml-2 font-bold uppercase">Correta</span>';
                            textClass = 'text-green-800 font-medium';
                        } else if (isUserSel && !isCorrect) {
                            badge = '<span class="text-xs bg-red-100 text-red-800 px-2 py-0.5 rounded ml-2 font-bold uppercase">Seu Erro</span>';
                            textClass = 'text-red-800 line-through opacity-80';
                        }
                        
                        optionsHTML += `<li class="flex items-start mt-2 text-sm ${textClass}">
                            <span class="mr-2 mt-0.5">▪</span> 
                            <span>${opt} ${badge}</span>
                        </li>`;
                    });

                    el.innerHTML = `
                        <h4 class="font-bold text-gray-800 mb-2">Questão ${log.index}:</h4>
                        <p class="text-gray-700 text-sm mb-3">${q.text}</p>
                        <ul class="mb-4 space-y-1 ml-2">
                            ${optionsHTML}
                        </ul>
                        <div class="bg-blue-50 border-l-4 border-blue-500 p-3 text-sm text-blue-900 rounded-r">
                            <strong class="block mb-1">Por que esta é a resposta?</strong>
                            ${q.explanation}
                        </div>
                    `;
                    reviewContainer.appendChild(el);
                });
            } else {
                reviewContainer.innerHTML = '<p class="text-green-600 font-bold p-4 bg-green-50 rounded border border-green-200">Impressionante! Você acertou todas as questões do simulado.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
